info:
  name: reset password
  type: http
  seq: 5

http:
  method: POST
  url: http://127.0.0.1:5100/auth/reset-password
  body:
    type: json
    data: |-
      {
        "reset_token": "{{reset_token}}",
        "new_password": "Nova@5678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
